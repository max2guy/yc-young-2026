<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f4efe4">
<title>새 회의자료 작성</title>
<style>
  :root {
    --bg: #f6f3ec;
    --panel: #ffffff;
    --line: #e2ddd2;
    --text: #1e1f1d;
    --muted: #6e6a61;
    --primary: #1f514d;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Noto Sans KR", sans-serif;
    background:
      radial-gradient(circle at top left, rgba(31, 81, 77, 0.08), transparent 28%),
      linear-gradient(180deg, #f9f6f0 0%, var(--bg) 100%);
    color: var(--text);
  }
  .shell {
    width: min(980px, calc(100% - 32px));
    margin: 0 auto;
    padding: 20px 0 40px;
  }
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 18px;
  }
  .topbar-left {
    min-width: 0;
  }
  .eyebrow {
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 1px;
    color: #5f7b74;
    margin-bottom: 6px;
  }
  .topbar h1 {
    margin: 0;
    font-size: clamp(24px, 4vw, 38px);
    line-height: 1.15;
  }
  .status {
    margin-top: 6px;
    font-size: 13px;
    color: var(--muted);
  }
  .actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 42px;
    padding: 0 16px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--text);
    text-decoration: none;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }
  .btn.primary {
    background: var(--primary);
    border-color: var(--primary);
    color: #fff;
  }
  .editor-shell {
    background: rgba(255,255,255,0.72);
    border: 1px solid rgba(226, 221, 210, 0.85);
    border-radius: 12px;
    padding: 22px;
    backdrop-filter: blur(10px);
  }
  .title-input {
    width: 100%;
    border: 0;
    background: transparent;
    font-size: clamp(28px, 5vw, 46px);
    font-weight: 800;
    line-height: 1.15;
    color: var(--text);
    outline: none;
    padding: 0;
    margin-bottom: 18px;
  }
  .title-input::placeholder {
    color: #b4aea2;
  }
  .editor {
    min-height: 68vh;
    padding: 22px 24px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--panel);
    outline: none;
    font-size: 17px;
    line-height: 1.8;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .editor:empty::before {
    content: attr(data-placeholder);
    color: #b8b1a5;
  }
  .meta {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    margin-top: 12px;
    font-size: 13px;
    color: var(--muted);
  }
  @media (max-width: 720px) {
    .shell { width: min(100% - 20px, 980px); }
    .topbar { align-items: flex-start; flex-direction: column; }
    .editor-shell { padding: 16px; }
    .editor { min-height: 62vh; padding: 18px; }
  }
</style>
</head>
<body>
  <div class="shell">
    <div class="topbar">
      <div class="topbar-left">
        <div class="eyebrow">일반 회의자료</div>
        <h1>새 회의자료 작성</h1>
        <div class="status" id="save-status">문서를 준비하는 중입니다.</div>
      </div>
      <div class="actions">
        <a class="btn" href="index.html">메인으로</a>
        <button class="btn primary" id="new-doc-btn" type="button">새 문서</button>
      </div>
    </div>
    <div class="editor-shell">
      <input class="title-input" id="title-input" type="text" placeholder="제목 없음" />
      <div
        class="editor"
        id="editor"
        contenteditable="true"
        spellcheck="false"
        data-placeholder="회의 내용을 자유롭게 기록하세요."
      ></div>
      <div class="meta">
        <span id="doc-id-text">문서 준비 중</span>
        <span id="updated-at-text">아직 저장되지 않았습니다.</span>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  <script src="sync-config.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const titleInput = document.getElementById('title-input');
    const editor = document.getElementById('editor');
    const saveStatus = document.getElementById('save-status');
    const docIdText = document.getElementById('doc-id-text');
    const updatedAtText = document.getElementById('updated-at-text');
    const newDocBtn = document.getElementById('new-doc-btn');

    const localKeyPrefix = 'meetingDocument:';
    const shouldStartNew = params.get('new') === '1';
    let currentId = params.get('id');
    let docRef = null;
    let docsRef = null;
    let saveTimer = null;
    let applyingRemote = false;
    let clientId = localStorage.getItem('meetingDocumentClientId');

    if (!clientId) {
      clientId = Date.now().toString(36) + Math.random().toString(36).slice(2);
      localStorage.setItem('meetingDocumentClientId', clientId);
    }

    function formatDate(value) {
      if (!value) return '아직 저장되지 않았습니다.';
      const date = new Date(value);
      return '마지막 저장 ' + date.getFullYear() + '.' +
        String(date.getMonth() + 1).padStart(2, '0') + '.' +
        String(date.getDate()).padStart(2, '0') + ' ' +
        String(date.getHours()).padStart(2, '0') + ':' +
        String(date.getMinutes()).padStart(2, '0');
    }

    function localKey(id) {
      return localKeyPrefix + id;
    }

    function initialDocument() {
      return {
        title: '',
        contentHtml: '',
        contentText: '',
        createdAt: Date.now(),
        updatedAt: Date.now(),
        updatedBy: clientId
      };
    }

    function setStatus(text) {
      saveStatus.textContent = text;
    }

    function setDocMeta(id, updatedAt) {
      docIdText.textContent = '문서 ID ' + id;
      updatedAtText.textContent = formatDate(updatedAt);
    }

    function collectDocument() {
      return {
        title: titleInput.value.trim(),
        contentHtml: editor.innerHTML,
        contentText: editor.innerText.trim(),
        updatedAt: Date.now(),
        updatedBy: clientId
      };
    }

    function applyDocument(data) {
      if (!data) return;
      applyingRemote = true;
      titleInput.value = data.title || '';
      editor.innerHTML = data.contentHtml || '';
      setDocMeta(currentId, data.updatedAt);
      applyingRemote = false;
    }

    function scheduleSave() {
      if (applyingRemote) return;
      clearTimeout(saveTimer);
      setStatus('저장 중...');
      saveTimer = setTimeout(function () {
        ensureDocumentRef();
        if (!docRef) return;
        const doc = collectDocument();
        localStorage.setItem(localKey(currentId), JSON.stringify(doc));
        doc.updatedAt = firebase.database.ServerValue.TIMESTAMP;
        docRef.update(doc);
      }, 300);
    }

    function attachDocListeners() {
      titleInput.addEventListener('input', scheduleSave);
      editor.addEventListener('input', scheduleSave);
      newDocBtn.addEventListener('click', function () {
        window.location.href = 'meeting-editor.html?new=1';
      });
    }

    function ensureDocumentRef() {
      if (docRef || !docsRef) return;
      const newRef = docsRef.push();
      currentId = newRef.key;
      docRef = docsRef.child(currentId);
      history.replaceState({}, '', 'meeting-editor.html?id=' + currentId);
      setDocMeta(currentId, null);
      newRef.set(initialDocument());
    }

    function bootFirebase() {
      if (!window.SPORTS_SYNC_CONFIG || !window.SPORTS_SYNC_CONFIG.firebase) {
        setStatus('Firebase 설정이 없습니다.');
        return;
      }

      if (!firebase.apps.length) {
        firebase.initializeApp(window.SPORTS_SYNC_CONFIG.firebase);
      }

      docsRef = firebase.database().ref('meetingDocuments');

      if (!currentId) {
        setStatus(shouldStartNew ? '제목이나 내용을 입력하면 새 문서가 만들어집니다.' : '새 문서를 준비했습니다.');
        docIdText.textContent = '아직 저장 전';
        updatedAtText.textContent = '아직 저장되지 않았습니다.';
        return;
      }

      docRef = docsRef.child(currentId);
      setDocMeta(currentId, null);

      try {
        const local = JSON.parse(localStorage.getItem(localKey(currentId)) || 'null');
        if (local) applyDocument(local);
      } catch (_) {}

      docRef.on('value', function (snap) {
        const data = snap.val();
        if (!data) {
          setStatus('문서를 찾지 못했습니다.');
          return;
        }
        if (data.updatedBy !== clientId) {
          applyDocument(data);
        } else {
          setDocMeta(currentId, data.updatedAt);
        }
        localStorage.setItem(localKey(currentId), JSON.stringify(data));
        setStatus(data.updatedBy === clientId ? '동기화 저장됨' : '원격 변경 반영됨');
        updatedAtText.textContent = formatDate(data.updatedAt);
      }, function () {
        setStatus('동기화 오류');
      });
    }

    attachDocListeners();
    bootFirebase();
  </script>
</body>
</html>
