<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1f436d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<title>새 회의자료 작성</title>
<style>
  :root {
    --bg: #e5ebf2;
    --panel: #ffffff;
    --line: #bcc7d3;
    --text: #132231;
    --muted: #4e5f70;
    --primary: #163f6b;
    --primary-soft: #d4e1ef;
    --primary-bright: linear-gradient(135deg, #2f5f95 0%, #163f6b 100%);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Noto Sans KR", sans-serif;
    background: linear-gradient(180deg, #edf2f7 0%, var(--bg) 100%);
    color: var(--text);
  }
  .shell {
    width: min(980px, calc(100% - 32px));
    margin: 0 auto;
    padding: 20px 0 40px;
  }
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 18px;
  }
  .topbar-left {
    min-width: 0;
  }
  .eyebrow {
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 1px;
    color: #3f5876;
    margin-bottom: 6px;
  }
  .topbar h1 {
    margin: 0;
    font-size: clamp(24px, 4vw, 38px);
    line-height: 1.15;
  }
  .status {
    margin-top: 6px;
    font-size: 13px;
    color: var(--muted);
  }
  .actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 42px;
    padding: 0 16px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--text);
    text-decoration: none;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }
  .btn.primary {
    background: var(--primary-bright);
    border-color: #1f436d;
    color: #fff;
    box-shadow: 0 12px 24px rgba(22, 63, 107, 0.22);
  }
  .editor-shell {
    background: #ffffff;
    border: 1px solid #bcc7d3;
    border-radius: 12px;
    padding: 22px;
    box-shadow: 0 14px 28px rgba(19, 34, 49, 0.08);
  }
  .toolbar {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 14px;
    padding: 4px 6px;
    border: 1px solid #bcc7d3;
    border-radius: 6px;
    background: #ffffff;
    position: sticky;
    top: 10px;
    z-index: 15;
    box-shadow: 0 6px 14px rgba(19, 34, 49, 0.1);
  }
  .toolbar-group {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    flex-wrap: wrap;
  }
  .toolbar-divider {
    width: 1px;
    height: 24px;
    align-self: center;
    background: #bcc7d3;
  }
  .toolbar-btn,
  .toolbar-select,
  .toolbar-swatch {
    min-height: 28px;
    border-radius: 3px;
    border: 1px solid #b7c3cf;
    background: #fff;
    color: var(--text);
    font-size: 12px;
    line-height: 1;
  }
  .toolbar-btn {
    min-width: 28px;
    padding: 0 8px;
    font-weight: 600;
    cursor: pointer;
  }
  .toolbar-btn:hover,
  .toolbar-select:hover,
  .toolbar-swatch:hover {
    border-color: #8ea6bf;
    background: #ffffff;
  }
  .toolbar-btn:focus-visible,
  .toolbar-select:focus-visible,
  .toolbar-swatch:focus-visible {
    outline: 2px solid rgba(22, 63, 107, 0.18);
    outline-offset: 1px;
    border-color: #163f6b;
    background: #fff;
  }
  .toolbar-btn.primary {
    font-weight: 700;
  }
  .toolbar-btn.soft {
    color: #415163;
    font-weight: 600;
  }
  .toolbar-select {
    padding: 0 26px 0 10px;
    cursor: pointer;
    border-color: #b7c3cf;
    background: #fff;
    appearance: none;
    background-image:
      linear-gradient(45deg, transparent 50%, #51667d 50%),
      linear-gradient(135deg, #51667d 50%, transparent 50%);
    background-position:
      calc(100% - 12px) 11px,
      calc(100% - 8px) 11px;
    background-size: 4px 4px, 4px 4px;
    background-repeat: no-repeat;
  }
  .toolbar-palette {
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .toolbar-swatch {
    width: 20px;
    min-width: 20px;
    min-height: 20px;
    padding: 0;
    cursor: pointer;
    border-radius: 999px;
  }
  .toolbar-select.font-name {
    min-width: 108px;
  }
  .toolbar-select.font-size {
    min-width: 76px;
  }
  .toolbar-select.block-format {
    min-width: 92px;
  }
  .toolbar-label {
    padding: 0 2px 0 0;
    color: #46586b;
    font-size: 11px;
    font-weight: 600;
    white-space: nowrap;
  }
  .toolbar-label.tight {
    padding-right: 0;
  }
  .toolbar-glyph {
    font-size: 18px;
    line-height: 1;
    letter-spacing: -0.02em;
  }
  .toolbar-glyph.subtle {
    color: #4e5f70;
  }
  .align-icon {
    display: inline-grid;
    gap: 2px;
    width: 12px;
  }
  .align-icon span {
    display: block;
    height: 2px;
    background: #455a72;
    border-radius: 999px;
  }
  .history-icon {
    width: 16px;
    height: 16px;
    display: block;
  }
  .history-icon path {
    fill: #455a72;
  }
  .align-left span:nth-child(1) { width: 12px; }
  .align-left span:nth-child(2) { width: 10px; }
  .align-left span:nth-child(3) { width: 8px; }
  .align-center { justify-items: center; }
  .align-center span:nth-child(1) { width: 12px; }
  .align-center span:nth-child(2) { width: 10px; }
  .align-center span:nth-child(3) { width: 8px; }
  .align-right { justify-items: end; }
  .align-right span:nth-child(1) { width: 12px; }
  .align-right span:nth-child(2) { width: 10px; }
  .align-right span:nth-child(3) { width: 8px; }
  .title-input {
    width: 100%;
    border: 0;
    background: transparent;
    font-size: clamp(28px, 5vw, 46px);
    font-weight: 800;
    line-height: 1.15;
    color: var(--text);
    outline: none;
    padding: 0;
    margin-bottom: 18px;
  }
  .title-input::placeholder {
    color: #8897a7;
  }
  .editor {
    min-height: 68vh;
    padding: 22px 24px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--panel);
    outline: none;
    font-size: 17px;
    line-height: 1.8;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .editor h2,
  .editor h3,
  .editor p,
  .editor ul,
  .editor ol,
  .editor blockquote {
    margin-top: 0;
  }
  .editor h2 {
    font-size: 1.5em;
    line-height: 1.35;
    margin-bottom: 12px;
  }
  .editor h3 {
    font-size: 1.2em;
    line-height: 1.4;
    margin-bottom: 10px;
  }
  .editor p,
  .editor ul,
  .editor ol {
    margin-bottom: 12px;
  }
  .editor blockquote {
    margin-bottom: 12px;
    padding-left: 14px;
    border-left: 3px solid #cfd9e4;
    color: #536474;
  }
  .editor hr {
    border: 0;
    border-top: 1px solid var(--line);
    margin: 18px 0;
  }
  .editor:empty::before {
    content: attr(data-placeholder);
    color: #b8b1a5;
  }
  .meta {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    margin-top: 12px;
    font-size: 13px;
    color: var(--muted);
  }
  @media (max-width: 720px) {
    .shell { width: min(100% - 20px, 980px); }
    .topbar { align-items: flex-start; flex-direction: column; }
    .editor-shell { padding: 16px; }
    .toolbar { padding: 6px; gap: 6px; }
    .editor { min-height: 62vh; padding: 18px; }
  }
</style>
</head>
<body>
  <div class="shell">
    <div class="topbar">
      <div class="topbar-left">
        <div class="eyebrow">일반 회의자료</div>
        <h1>새 회의자료 작성</h1>
        <div class="status" id="save-status">문서를 준비하는 중입니다.</div>
      </div>
      <div class="actions">
        <a class="btn" href="index.html">메인으로</a>
        <button class="btn primary" id="new-doc-btn" type="button">새 문서</button>
      </div>
    </div>
    <div class="editor-shell">
      <input class="title-input" id="title-input" type="text" placeholder="제목 없음" />
      <div class="toolbar" id="toolbar">
        <div class="toolbar-group">
          <button class="toolbar-btn soft" type="button" data-command="undo" aria-label="되돌리기">
            <svg class="history-icon" viewBox="0 0 16 16" aria-hidden="true">
              <path d="M6.2 3.2 1.8 7.1l4.4 3.8V8.6h2.7c2.4 0 4.3 1.9 4.3 4.2v.2h1.6v-.2c0-3.2-2.6-5.8-5.9-5.8H6.2V3.2z"/>
            </svg>
          </button>
          <button class="toolbar-btn soft" type="button" data-command="redo" aria-label="다시 실행">
            <svg class="history-icon" viewBox="0 0 16 16" aria-hidden="true">
              <path d="m9.8 3.2 4.4 3.9-4.4 3.8V8.6H7.1c-2.4 0-4.3 1.9-4.3 4.2v.2H1.2v-.2c0-3.2 2.6-5.8 5.9-5.8h2.7V3.2z"/>
            </svg>
          </button>
        </div>
        <div class="toolbar-divider"></div>
        <div class="toolbar-group">
          <select class="toolbar-select font-name" id="font-name">
            <option value="">폰트</option>
            <option value="-apple-system">기본</option>
            <option value="Arial">Arial</option>
            <option value="Georgia">Georgia</option>
            <option value="'Noto Sans KR'">Noto Sans KR</option>
          </select>
          <select class="toolbar-select font-size" id="font-size">
            <option value="">크기</option>
            <option value="2">작게</option>
            <option value="3">보통</option>
            <option value="5">크게</option>
            <option value="6">매우 크게</option>
          </select>
        </div>
        <div class="toolbar-divider"></div>
        <div class="toolbar-group">
          <button class="toolbar-btn primary" type="button" data-command="bold"><span class="toolbar-glyph">가</span></button>
          <button class="toolbar-btn soft" type="button" data-command="italic"><span class="toolbar-glyph subtle"><em>가</em></span></button>
          <button class="toolbar-btn soft" type="button" data-command="underline"><span class="toolbar-glyph subtle"><u>가</u></span></button>
        </div>
        <div class="toolbar-divider"></div>
        <div class="toolbar-group">
          <span class="toolbar-label tight">글자</span>
          <div class="toolbar-palette" id="text-palette">
            <button class="toolbar-swatch" type="button" data-color-command="foreColor" data-color-value="#1e1f1d" style="background:#1e1f1d" aria-label="기본 글자색"></button>
            <button class="toolbar-swatch" type="button" data-color-command="foreColor" data-color-value="#8b0000" style="background:#8b0000" aria-label="빨강 글자색"></button>
            <button class="toolbar-swatch" type="button" data-color-command="foreColor" data-color-value="#0b5394" style="background:#0b5394" aria-label="파랑 글자색"></button>
            <button class="toolbar-swatch" type="button" data-color-command="foreColor" data-color-value="#38761d" style="background:#38761d" aria-label="초록 글자색"></button>
            <button class="toolbar-swatch" type="button" data-color-command="foreColor" data-color-value="#5b2c83" style="background:#5b2c83" aria-label="보라 글자색"></button>
          </div>
        </div>
        <div class="toolbar-divider"></div>
        <div class="toolbar-group">
          <button class="toolbar-btn" type="button" data-command="insertUnorderedList">•</button>
          <button class="toolbar-btn" type="button" data-command="insertOrderedList">1.</button>
        </div>
        <div class="toolbar-divider"></div>
        <div class="toolbar-group">
          <button class="toolbar-btn" type="button" data-command="justifyLeft" aria-label="왼쪽 정렬">
            <span class="align-icon align-left"><span></span><span></span><span></span></span>
          </button>
          <button class="toolbar-btn" type="button" data-command="justifyCenter" aria-label="가운데 정렬">
            <span class="align-icon align-center"><span></span><span></span><span></span></span>
          </button>
          <button class="toolbar-btn" type="button" data-command="justifyRight" aria-label="오른쪽 정렬">
            <span class="align-icon align-right"><span></span><span></span><span></span></span>
          </button>
        </div>
        <div class="toolbar-divider"></div>
        <div class="toolbar-group">
          <select class="toolbar-select block-format" id="block-format">
            <option value="default">본문</option>
            <option value="h2">제목 1</option>
            <option value="h3">제목 2</option>
            <option value="blockquote">인용문</option>
          </select>
          <button class="toolbar-btn soft" type="button" id="insert-divider-btn">―</button>
        </div>
      </div>
      <div
        class="editor"
        id="editor"
        contenteditable="true"
        spellcheck="false"
        data-placeholder="회의 내용을 자유롭게 기록하세요."
      ></div>
      <div class="meta">
        <span id="doc-id-text">문서 준비 중</span>
        <span id="updated-at-text">아직 저장되지 않았습니다.</span>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  <script src="sync-config.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const titleInput = document.getElementById('title-input');
    const editor = document.getElementById('editor');
    const saveStatus = document.getElementById('save-status');
    const docIdText = document.getElementById('doc-id-text');
    const updatedAtText = document.getElementById('updated-at-text');
    const newDocBtn = document.getElementById('new-doc-btn');
    const toolbar = document.getElementById('toolbar');
    const blockFormat = document.getElementById('block-format');
    const fontName = document.getElementById('font-name');
    const fontSize = document.getElementById('font-size');
    const insertDividerBtn = document.getElementById('insert-divider-btn');

    const localKeyPrefix = 'meetingDocument:';
    const shouldStartNew = params.get('new') === '1';
    let currentId = params.get('id');
    let docRef = null;
    let docsRef = null;
    let saveTimer = null;
    let applyingRemote = false;
    let savedRange = null;
    let clientId = localStorage.getItem('meetingDocumentClientId');

    if (!clientId) {
      clientId = Date.now().toString(36) + Math.random().toString(36).slice(2);
      localStorage.setItem('meetingDocumentClientId', clientId);
    }

    function formatDate(value) {
      if (!value) return '아직 저장되지 않았습니다.';
      const date = new Date(value);
      return '마지막 저장 ' + date.getFullYear() + '.' +
        String(date.getMonth() + 1).padStart(2, '0') + '.' +
        String(date.getDate()).padStart(2, '0') + ' ' +
        String(date.getHours()).padStart(2, '0') + ':' +
        String(date.getMinutes()).padStart(2, '0');
    }

    function localKey(id) {
      return localKeyPrefix + id;
    }

    function initialDocument() {
      return {
        title: '',
        contentHtml: '',
        contentText: '',
        createdAt: Date.now(),
        updatedAt: Date.now(),
        updatedBy: clientId
      };
    }

    function setStatus(text) {
      saveStatus.textContent = text;
    }

    function setDocMeta(id, updatedAt) {
      docIdText.textContent = '문서 ID ' + id;
      updatedAtText.textContent = formatDate(updatedAt);
    }

    function collectDocument() {
      return {
        title: titleInput.value.trim(),
        contentHtml: editor.innerHTML,
        contentText: editor.innerText.trim(),
        updatedAt: Date.now(),
        updatedBy: clientId
      };
    }

    function applyDocument(data) {
      if (!data) return;
      applyingRemote = true;
      titleInput.value = data.title || '';
      editor.innerHTML = data.contentHtml || '';
      setDocMeta(currentId, data.updatedAt);
      applyingRemote = false;
    }

    function focusEditor() {
      editor.focus();
    }

    function saveSelection() {
      const selection = window.getSelection();
      if (!selection || selection.rangeCount === 0) return;
      const range = selection.getRangeAt(0);
      if (!editor.contains(range.commonAncestorContainer)) return;
      savedRange = range.cloneRange();
    }

    function restoreSelection() {
      if (!savedRange) return;
      const selection = window.getSelection();
      if (!selection) return;
      selection.removeAllRanges();
      selection.addRange(savedRange);
    }

    function runCommand(command, value) {
      focusEditor();
      restoreSelection();
      document.execCommand(command, false, value);
      saveSelection();
      scheduleSave();
    }

    function scheduleSave() {
      if (applyingRemote) return;
      clearTimeout(saveTimer);
      setStatus('저장 중...');
      saveTimer = setTimeout(function () {
        ensureDocumentRef();
        if (!docRef) return;
        const doc = collectDocument();
        localStorage.setItem(localKey(currentId), JSON.stringify(doc));
        doc.updatedAt = firebase.database.ServerValue.TIMESTAMP;
        docRef.update(doc);
      }, 300);
    }

    function attachDocListeners() {
      try {
        document.execCommand('styleWithCSS', false, true);
      } catch (_) {}

      titleInput.addEventListener('input', scheduleSave);
      editor.addEventListener('input', scheduleSave);
      editor.addEventListener('mouseup', saveSelection);
      editor.addEventListener('keyup', saveSelection);
      editor.addEventListener('focus', saveSelection);
      toolbar.addEventListener('click', function (event) {
        const button = event.target.closest('[data-command]');
        if (button) {
          runCommand(button.dataset.command);
          return;
        }
        const colorButton = event.target.closest('[data-color-command]');
        if (!colorButton) return;
        runCommand(colorButton.dataset.colorCommand, colorButton.dataset.colorValue);
      });
      blockFormat.addEventListener('change', function () {
        if (!blockFormat.value) return;
        if (blockFormat.value === 'default') {
          runCommand('formatBlock', 'p');
        } else {
          runCommand('formatBlock', blockFormat.value);
        }
        blockFormat.value = 'default';
      });
      fontName.addEventListener('change', function () {
        if (!fontName.value) return;
        runCommand('fontName', fontName.value);
        fontName.value = '';
      });
      fontSize.addEventListener('change', function () {
        if (!fontSize.value) return;
        runCommand('fontSize', fontSize.value);
        fontSize.value = '';
      });
      insertDividerBtn.addEventListener('click', function () {
        runCommand('insertHorizontalRule');
      });
      newDocBtn.addEventListener('click', function () {
        window.location.href = 'meeting-editor.html?new=1';
      });
    }

    function ensureDocumentRef() {
      if (docRef || !docsRef) return;
      const newRef = docsRef.push();
      currentId = newRef.key;
      docRef = docsRef.child(currentId);
      history.replaceState({}, '', 'meeting-editor.html?id=' + currentId);
      setDocMeta(currentId, null);
      newRef.set(initialDocument());
    }

    function bootFirebase() {
      if (!window.SPORTS_SYNC_CONFIG || !window.SPORTS_SYNC_CONFIG.firebase) {
        setStatus('Firebase 설정이 없습니다.');
        return;
      }

      if (!firebase.apps.length) {
        firebase.initializeApp(window.SPORTS_SYNC_CONFIG.firebase);
      }

      docsRef = firebase.database().ref('meetingDocuments');

      if (!currentId) {
        setStatus(shouldStartNew ? '제목이나 내용을 입력하면 새 문서가 만들어집니다.' : '새 문서를 준비했습니다.');
        docIdText.textContent = '아직 저장 전';
        updatedAtText.textContent = '아직 저장되지 않았습니다.';
        return;
      }

      docRef = docsRef.child(currentId);
      setDocMeta(currentId, null);

      try {
        const local = JSON.parse(localStorage.getItem(localKey(currentId)) || 'null');
        if (local) applyDocument(local);
      } catch (_) {}

      docRef.on('value', function (snap) {
        const data = snap.val();
        if (!data) {
          setStatus('문서를 찾지 못했습니다.');
          return;
        }
        if (data.updatedBy !== clientId) {
          applyDocument(data);
        } else {
          setDocMeta(currentId, data.updatedAt);
        }
        localStorage.setItem(localKey(currentId), JSON.stringify(data));
        setStatus(data.updatedBy === clientId ? '동기화 저장됨' : '원격 변경 반영됨');
        updatedAtText.textContent = formatDate(data.updatedAt);
      }, function () {
        setStatus('동기화 오류');
      });
    }

    attachDocListeners();
    bootFirebase();
  </script>
</body>
</html>
