<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;800&display=swap" rel="stylesheet">
<title>문서 보기</title>
<style>
  :root {
    --bg: #e6ebf1;
    --text: #132231;
    --muted: #4e5f70;
    --line: #bcc7d3;
    --green: #163f6b;
    --green-soft: #d4e1ef;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Noto Sans KR", -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .topbar {
    position: sticky;
    top: 0;
    z-index: 100;
    background: #fff;
    border-bottom: 1px solid var(--line);
    box-shadow: 0 2px 8px rgba(19, 34, 49, 0.06);
    padding-top: env(safe-area-inset-top);
  }
  .topbar-inner {
    display: flex;
    align-items: center;
    gap: 12px;
    max-width: 860px;
    margin: 0 auto;
    padding-left: max(16px, env(safe-area-inset-left));
    padding-right: max(16px, env(safe-area-inset-right));
    height: 52px;
  }
  .topbar-back {
    display: inline-flex;
    align-items: center;
    height: 34px;
    padding: 0 12px;
    border-radius: 7px;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--text);
    font-size: 13px;
    font-weight: 700;
    text-decoration: none;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .topbar-title {
    flex: 1;
    min-width: 0;
    font-size: 14px;
    font-weight: 800;
    color: var(--green);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .topbar-download {
    display: inline-flex;
    align-items: center;
    height: 34px;
    padding: 0 12px;
    border-radius: 7px;
    background: var(--green);
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    text-decoration: none;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .viewer {
    max-width: 860px;
    margin: 0 auto;
    padding: 20px 16px 56px;
    padding-left: max(16px, env(safe-area-inset-left));
    padding-right: max(16px, env(safe-area-inset-right));
  }
  .page-stack {
    display: grid;
    gap: 14px;
  }
  .page-card {
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 4px 16px rgba(19, 34, 49, 0.1);
    overflow: hidden;
  }
  .page-canvas {
    display: block;
    width: 100%;
    height: auto;
  }
  .page-label {
    padding: 8px 14px;
    border-top: 1px solid var(--line);
    background: #f8fafc;
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
  }
  .status {
    text-align: center;
    padding: 56px 20px;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.8;
  }
  .progress-bar {
    height: 3px;
    background: var(--green-soft);
    position: relative;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--green);
    width: 0%;
    transition: width 200ms ease;
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
  <div class="topbar-inner">
    <a class="topbar-back" href="index.html">← 돌아가기</a>
    <div class="topbar-title" id="doc-title">문서 보기</div>
    <a class="topbar-download" id="download-btn" href="#">다운로드</a>
  </div>
</header>
<div class="viewer">
  <div class="page-stack" id="page-stack">
    <div class="status" id="status">문서를 불러오는 중입니다…</div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
  var params = new URLSearchParams(location.search);
  var file = params.get('file') || '';
  var title = params.get('title') || 'PDF 문서';

  document.title = title;
  document.getElementById('doc-title').textContent = title;
  var dlBtn = document.getElementById('download-btn');
  dlBtn.href = file;
  dlBtn.setAttribute('download', '');

  var statusEl = document.getElementById('status');
  var stack = document.getElementById('page-stack');
  var progressFill = document.getElementById('progress');

  if (!file) {
    statusEl.textContent = '불러올 파일이 지정되지 않았습니다.';
  } else {
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    pdfjsLib.getDocument(file).promise.then(function (pdf) {
      statusEl.remove();
      var total = pdf.numPages;
      var rendered = 0;

      function renderPage(num) {
        return pdf.getPage(num).then(function (page) {
          var scale = window.devicePixelRatio >= 2 ? 2.0 : 1.5;
          var viewport = page.getViewport({ scale: scale });

          var card = document.createElement('div');
          card.className = 'page-card';

          var canvas = document.createElement('canvas');
          canvas.className = 'page-canvas';
          canvas.width = viewport.width;
          canvas.height = viewport.height;

          var label = document.createElement('div');
          label.className = 'page-label';
          label.textContent = num + ' / ' + total;

          card.appendChild(canvas);
          card.appendChild(label);
          stack.appendChild(card);

          return page.render({ canvasContext: canvas.getContext('2d'), viewport: viewport }).promise.then(function () {
            rendered++;
            progressFill.style.width = Math.round((rendered / total) * 100) + '%';
            if (rendered === total) {
              progressFill.style.opacity = '0';
            }
          });
        });
      }

      (function loop(n) {
        if (n > total) return;
        renderPage(n).then(function () { loop(n + 1); });
      })(1);

    }).catch(function (err) {
      statusEl.innerHTML = '문서를 불러오지 못했습니다.<br><small>' + err.message + '</small>';
    });
  }
</script>
</body>
</html>
