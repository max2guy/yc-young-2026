<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;800&display=swap" rel="stylesheet">
<title>문서 보기</title>
<style>
  :root {
    --bg: #e6ebf1;
    --text: #132231;
    --muted: #4e5f70;
    --line: #bcc7d3;
    --green: #163f6b;
    --green-soft: #d4e1ef;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Noto Sans KR", -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
  }
  .topbar {
    flex-shrink: 0;
    position: sticky;
    top: 0;
    z-index: 100;
    background: #fff;
    border-bottom: 1px solid var(--line);
    box-shadow: 0 2px 8px rgba(19, 34, 49, 0.06);
    padding-top: env(safe-area-inset-top);
  }
  .topbar-inner {
    display: flex;
    align-items: center;
    gap: 12px;
    max-width: 860px;
    margin: 0 auto;
    padding-left: max(16px, env(safe-area-inset-left));
    padding-right: max(16px, env(safe-area-inset-right));
    height: 52px;
  }
  .topbar-back {
    display: inline-flex;
    align-items: center;
    height: 34px;
    padding: 0 12px;
    border-radius: 7px;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--text);
    font-size: 13px;
    font-weight: 700;
    text-decoration: none;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .topbar-title {
    flex: 1;
    min-width: 0;
    font-size: 14px;
    font-weight: 800;
    color: var(--green);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .topbar-download {
    display: inline-flex;
    align-items: center;
    height: 34px;
    padding: 0 12px;
    border-radius: 7px;
    background: var(--green);
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    text-decoration: none;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .pdf-frame {
    flex: 1;
    width: 100%;
    border: none;
    display: block;
    min-height: 0;
  }
  .fallback {
    display: none;
    flex: 1;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 16px;
    padding: 40px 20px;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.7;
  }
  .fallback a {
    display: inline-flex;
    align-items: center;
    height: 40px;
    padding: 0 20px;
    border-radius: 8px;
    background: var(--green);
    color: #fff;
    font-size: 14px;
    font-weight: 700;
    text-decoration: none;
  }
  .error { display: flex; }
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="topbar-back" href="index.html">← 돌아가기</a>
    <div class="topbar-title" id="doc-title">문서 보기</div>
    <a class="topbar-download" id="download-btn" href="#">다운로드</a>
  </div>
</header>
<iframe class="pdf-frame" id="pdf-frame" title="PDF 문서"></iframe>
<div class="fallback" id="fallback">
  <div>이 기기에서는 PDF를 직접 표시할 수 없습니다.<br>아래 버튼으로 다운로드하세요.</div>
  <a id="fallback-dl" href="#">PDF 다운로드</a>
</div>
<script>
  var params = new URLSearchParams(location.search);
  var file = params.get('file') || '';
  var title = params.get('title') || 'PDF 문서';

  document.title = title;
  document.getElementById('doc-title').textContent = title;

  var dlBtn = document.getElementById('download-btn');
  dlBtn.href = file;
  dlBtn.setAttribute('download', '');

  var fallbackDl = document.getElementById('fallback-dl');
  fallbackDl.href = file;

  var isAndroid = /Android/i.test(navigator.userAgent);
  var isExternalUrl = /^https?:\/\//i.test(file);

  if (!file) {
    document.getElementById('fallback').style.display = 'flex';
    document.getElementById('fallback').querySelector('div').textContent = '불러올 파일이 지정되지 않았습니다.';
    document.getElementById('pdf-frame').style.display = 'none';
  } else if (isAndroid && isExternalUrl) {
    // Android + 외부 URL(Firebase Storage 등): 새 탭으로 직접 열기
    document.getElementById('pdf-frame').style.display = 'none';
    var fb = document.getElementById('fallback');
    fb.style.display = 'flex';
    fb.querySelector('div').textContent = '아래 버튼을 눌러 PDF를 여세요.';
    fallbackDl.textContent = 'PDF 열기';
    fallbackDl.setAttribute('target', '_blank');
    fallbackDl.removeAttribute('download');
  } else {
    var frame = document.getElementById('pdf-frame');
    frame.src = file;
    frame.onerror = function () {
      frame.style.display = 'none';
      document.getElementById('fallback').style.display = 'flex';
    };
  }
</script>
</body>
</html>
