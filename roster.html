<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1f436d">
<meta name="robots" content="noindex">
<title>학생 명단 - 연천장로교회 중고등부</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #e6ebf1;
    --text: #132231;
    --muted: #4e5f70;
    --line: #bcc7d3;
    --green: #163f6b;
    --card: #ffffff;
    --shadow-md: 0 12px 24px rgba(19, 34, 49, 0.08);
    --max-w: 860px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Noto Sans KR", -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.55;
  }
  a { color: inherit; text-decoration: none; }

  .topbar {
    position: sticky;
    top: 0;
    z-index: 100;
    background: #ffffff;
    border-bottom: 1px solid var(--line);
    box-shadow: 0 2px 8px rgba(19, 34, 49, 0.06);
    padding-top: env(safe-area-inset-top);
  }
  .topbar-inner {
    display: flex;
    align-items: center;
    gap: 12px;
    max-width: var(--max-w);
    margin: 0 auto;
    padding: 0 max(20px, env(safe-area-inset-right));
    padding-left: max(20px, env(safe-area-inset-left));
    height: 52px;
  }
  .topbar-back {
    display: inline-flex;
    align-items: center;
    height: 34px;
    padding: 0 12px;
    border-radius: 7px;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--text);
    font-size: 13px;
    font-weight: 700;
    white-space: nowrap;
  }
  .topbar-title {
    font-size: 14px;
    font-weight: 800;
    color: var(--green);
  }

  .page-wrap {
    max-width: var(--max-w);
    margin: 0 auto;
    padding: 24px 20px 56px;
  }

  .hero {
    padding: 24px 28px 22px;
    border-radius: 16px;
    background: linear-gradient(135deg, #2f5f95 0%, #163f6b 100%);
    box-shadow: 0 12px 32px rgba(22, 63, 107, 0.24);
    margin-bottom: 18px;
  }
  .hero-label {
    margin: 0 0 6px;
    font-size: 11px;
    font-weight: 700;
    color: rgba(255, 255, 255, 0.55);
    letter-spacing: 0.4px;
  }
  .hero h1 {
    margin: 0;
    font-size: clamp(22px, 3vw, 30px);
    color: #ffffff;
  }

  .section {
    padding: 18px 20px;
    border: 1px solid var(--line);
    border-top: 3px solid #7c3aed;
    border-radius: 14px;
    background: var(--card);
    box-shadow: var(--shadow-md);
  }
  .section-title {
    margin: 0 0 12px;
    font-size: 18px;
    font-weight: 800;
    color: #7c3aed;
  }
  #roster-total-count {
    margin-left: 4px;
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
  }

  .roster-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  .roster-col-head {
    font-size: 13px;
    font-weight: 800;
    color: var(--green);
    padding-bottom: 9px;
    border-bottom: 2px solid var(--line);
    margin-bottom: 12px;
  }
  .roster-grade-block { margin-bottom: 16px; }
  .roster-grade-block:last-child { margin-bottom: 0; }
  .roster-grade-head {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 8px;
  }
  .roster-grade-label {
    font-size: 12px;
    font-weight: 800;
    color: var(--text);
  }
  .roster-grade-count {
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
  }
  .roster-add-btn {
    margin-left: auto;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 1.5px solid var(--line);
    background: transparent;
    color: var(--muted);
    font-size: 16px;
    font-weight: 300;
    line-height: 1;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-family: inherit;
  }
  .roster-add-btn:hover { border-color: #7c3aed; color: #7c3aed; }
  .roster-chips { display: flex; flex-direction: column; gap: 6px; }
  .roster-chip-wrap { display: block; }
  .roster-chip {
    display: flex;
    align-items: center;
    width: 100%;
    padding: 6px 10px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: #fff;
    font-family: inherit;
    cursor: pointer;
    text-align: left;
  }
  .roster-chip.open { border-color: #7c3aed; background: #f3ecfd; }
  .roster-chip-name {
    font-size: 12px;
    font-weight: 700;
    color: var(--text);
  }
  .roster-empty { font-size: 12px; color: var(--muted); }

  .roster-detail {
    margin: 4px 0 4px 4px;
    padding: 10px 12px;
    border-radius: 10px;
    background: #f7f8fa;
    border: 1px solid var(--line);
  }
  .roster-detail-row {
    display: flex;
    gap: 8px;
    font-size: 12px;
    padding: 3px 0;
  }
  .roster-detail-label {
    flex-shrink: 0;
    width: 56px;
    color: var(--muted);
    font-weight: 700;
  }
  .roster-detail-value { color: var(--text); }
  .roster-detail-empty { color: var(--muted); }
  .roster-detail-actions {
    display: flex;
    gap: 8px;
    margin-top: 8px;
  }
  .roster-edit-btn, .roster-del-btn {
    font-size: 12px;
    font-weight: 700;
    padding: 5px 10px;
    border-radius: 7px;
    border: 1px solid var(--line);
    background: #fff;
    cursor: pointer;
    font-family: inherit;
  }
  .roster-edit-btn:hover { border-color: var(--green); color: var(--green); }
  .roster-del-btn:hover { border-color: #ef4444; color: #ef4444; }

  @media (max-width: 380px) {
    .roster-grid { grid-template-columns: 1fr; }
  }

  /* ── 모달 ── */
  .roster-modal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .roster-modal.open { display: flex; }
  .roster-modal-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(19, 34, 49, 0.45);
  }
  .roster-modal-box {
    position: relative;
    width: 100%;
    max-width: 380px;
    background: #fff;
    border-radius: 14px;
    padding: 20px;
    box-shadow: 0 20px 48px rgba(19, 34, 49, 0.3);
  }
  .roster-modal-box h3 {
    margin: 0 0 14px;
    font-size: 16px;
    color: var(--green);
  }
  .roster-modal-box label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
    margin: 10px 0 4px;
  }
  .roster-modal-box input,
  .roster-modal-box select {
    width: 100%;
    height: 36px;
    padding: 0 10px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 13px;
    font-family: inherit;
  }
  .roster-modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 18px;
  }
  .roster-modal-actions button {
    height: 36px;
    padding: 0 16px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    border: 1px solid var(--line);
    background: #fff;
  }
  .roster-modal-actions button[type="submit"] {
    background: var(--green);
    border-color: var(--green);
    color: #fff;
  }

  @media (max-width: 600px) {
    .page-wrap { padding: 16px 14px 48px; }
    .hero { padding: 18px 20px 16px; }
    .section { padding: 14px 16px; }
  }
</style>
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <a href="index.html" class="topbar-back">← 돌아가기</a>
      <span class="topbar-title">학생 명단</span>
    </div>
  </header>

  <div class="page-wrap">
    <section class="hero">
      <div class="hero-label">연천장로교회 중고등부</div>
      <h1>학생 명단</h1>
    </section>

    <section class="section" aria-labelledby="roster-title">
      <h2 class="section-title" id="roster-title">학년별 명단<span id="roster-total-count"></span></h2>
      <div id="roster-root"></div>
    </section>
  </div>

  <div class="roster-modal" id="roster-modal">
    <div class="roster-modal-backdrop" id="roster-modal-backdrop"></div>
    <div class="roster-modal-box">
      <h3 id="roster-modal-title">학생 추가</h3>
      <form id="roster-modal-form">
        <label for="rf-grade">학년</label>
        <select id="rf-grade">
          <option value="중1">중1</option>
          <option value="중2">중2</option>
          <option value="중3">중3</option>
          <option value="고1">고1</option>
          <option value="고2">고2</option>
          <option value="고3">고3</option>
        </select>

        <label for="rf-name">이름</label>
        <input type="text" id="rf-name" required>

        <label for="rf-phone">전화번호</label>
        <input type="text" id="rf-phone" placeholder="010-0000-0000">

        <label for="rf-birthday">생일</label>
        <input type="text" id="rf-birthday" placeholder="YYYY-MM-DD">

        <label for="rf-school">학교</label>
        <input type="text" id="rf-school">

        <label for="rf-address">주소</label>
        <input type="text" id="rf-address">

        <div class="roster-modal-actions">
          <button type="button" id="roster-modal-cancel">취소</button>
          <button type="submit">저장</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="sync-config.js"></script>
  <script src="roster-sync.js"></script>
</body>
</html>
