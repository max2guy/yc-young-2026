<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>중고등부 계획서</title>
<style>
  :root {
    --bg: #f4f1eb;
    --paper: #ffffff;
    --text: #1f1f1f;
    --muted: #6b675f;
    --primary: #1f514d;
    --line: #ddd6c8;
    --accent: #7b4b2a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Noto Sans KR", sans-serif;
    color: var(--text);
    background: var(--bg);
  }
  .shell {
    min-height: 100vh;
    display: grid;
    grid-template-rows: auto 1fr;
  }
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 18px 20px;
    background: var(--paper);
    border-bottom: 1px solid var(--line);
  }
  .title {
    min-width: 0;
  }
  .title h1 {
    margin: 0;
    font-size: 22px;
  }
  .title p {
    margin: 4px 0 0;
    font-size: 13px;
    color: var(--muted);
  }
  .actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 42px;
    padding: 0 16px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--text);
    text-decoration: none;
    font-size: 14px;
    font-weight: 700;
  }
  .btn.primary {
    background: var(--primary);
    border-color: var(--primary);
    color: #fff;
  }
  .viewer-wrap {
    padding: 18px;
  }
  .viewer {
    width: 100%;
    height: calc(100vh - 103px);
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--paper);
  }
  @media (max-width: 720px) {
    .topbar {
      align-items: flex-start;
      flex-direction: column;
    }
    .viewer {
      height: calc(100vh - 162px);
    }
  }
</style>
</head>
<body>
  <div class="shell">
    <div class="topbar">
      <div class="title">
        <h1>중고등부 계획서</h1>
        <p>브라우저에서 바로 열람하고 필요하면 내려받을 수 있습니다.</p>
      </div>
      <div class="actions">
        <a class="btn" href="index.html">메인으로</a>
        <a class="btn primary" href="2026-middle-high-plan.pdf" download>다운로드</a>
      </div>
    </div>
    <div class="viewer-wrap">
      <iframe
        class="viewer"
        src="2026-middle-high-plan.pdf"
        title="중고등부 계획서 PDF"
      ></iframe>
    </div>
  </div>
</body>
</html>
