<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>중고등부 계획서</title>
<style>
  :root {
    --bg: #f4f1eb;
    --paper: #ffffff;
    --text: #1f1f1f;
    --muted: #6b675f;
    --primary: #1f514d;
    --line: #ddd6c8;
    --accent: #7b4b2a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Noto Sans KR", sans-serif;
    color: var(--text);
    background: var(--bg);
  }
  .shell {
    min-height: 100vh;
    display: grid;
    grid-template-rows: auto 1fr;
  }
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 18px 20px;
    background: var(--paper);
    border-bottom: 1px solid var(--line);
  }
  .title {
    min-width: 0;
  }
  .title h1 {
    margin: 0;
    font-size: 22px;
  }
  .title p {
    margin: 4px 0 0;
    font-size: 13px;
    color: var(--muted);
  }
  .actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 42px;
    padding: 0 16px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--text);
    text-decoration: none;
    font-size: 14px;
    font-weight: 700;
  }
  .btn.primary {
    background: var(--primary);
    border-color: var(--primary);
    color: #fff;
  }
  .viewer-wrap {
    padding: 18px;
  }
  .viewer {
    min-height: calc(100vh - 103px);
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #efe8dc;
    padding: 18px;
  }
  .viewer-status {
    padding: 24px 18px;
    color: var(--muted);
    font-size: 14px;
    text-align: center;
  }
  .page-stack {
    display: grid;
    gap: 18px;
  }
  .page-card {
    background: var(--paper);
    border-radius: 6px;
    box-shadow: 0 6px 20px rgba(31, 31, 31, 0.08);
    overflow: hidden;
  }
  .page-canvas {
    display: block;
    width: 100%;
    height: auto;
  }
  .viewer-fallback {
    margin-top: 14px;
    text-align: center;
  }
  .viewer-fallback a {
    color: var(--accent);
    font-weight: 700;
  }
  @media (max-width: 720px) {
    .topbar {
      align-items: flex-start;
      flex-direction: column;
    }
    .viewer {
      min-height: calc(100vh - 162px);
      padding: 12px;
    }
  }
</style>
</head>
<body>
  <div class="shell">
    <div class="topbar">
      <div class="title">
        <h1>중고등부 계획서</h1>
        <p>브라우저에서 바로 열람하고 필요하면 내려받을 수 있습니다.</p>
      </div>
      <div class="actions">
        <a class="btn" href="index.html">메인으로</a>
        <a class="btn primary" href="2026-middle-high-plan.pdf" download>다운로드</a>
      </div>
    </div>
    <div class="viewer-wrap">
      <div class="viewer" id="viewer">
        <div class="viewer-status" id="viewer-status">계획서를 불러오는 중입니다.</div>
        <div class="page-stack" id="page-stack"></div>
        <div class="viewer-fallback" id="viewer-fallback" hidden>
          <a href="2026-middle-high-plan.pdf" target="_blank" rel="noreferrer">PDF 직접 열기</a>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs" type="module"></script>
  <script type="module">
    import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs';

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs';

    const pdfUrl = '2026-middle-high-plan.pdf';
    const statusEl = document.getElementById('viewer-status');
    const stackEl = document.getElementById('page-stack');
    const fallbackEl = document.getElementById('viewer-fallback');

    function showError() {
      statusEl.textContent = '브라우저 안에서 바로 보여주지 못했습니다.';
      fallbackEl.hidden = false;
    }

    async function renderPage(pdf, pageNumber) {
      const page = await pdf.getPage(pageNumber);
      const baseViewport = page.getViewport({ scale: 1 });
      const containerWidth = stackEl.clientWidth || 900;
      const scale = Math.min(2, containerWidth / baseViewport.width);
      const viewport = page.getViewport({ scale });
      const canvas = document.createElement('canvas');
      const context = canvas.getContext('2d');

      canvas.width = Math.floor(viewport.width);
      canvas.height = Math.floor(viewport.height);
      canvas.className = 'page-canvas';

      const card = document.createElement('div');
      card.className = 'page-card';
      card.appendChild(canvas);
      stackEl.appendChild(card);

      await page.render({
        canvasContext: context,
        viewport
      }).promise;
    }

    async function boot() {
      try {
        const pdf = await pdfjsLib.getDocument(pdfUrl).promise;
        statusEl.hidden = true;
        for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber += 1) {
          await renderPage(pdf, pageNumber);
        }
      } catch (error) {
        console.error(error);
        showError();
      }
    }

    boot();
  </script>
</body>
</html>
