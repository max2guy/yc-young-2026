<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>중고등부 계획서</title>
<style>
  :root {
    --bg: #f4f1eb;
    --paper: #ffffff;
    --text: #1f1f1f;
    --muted: #6b675f;
    --primary: #1f514d;
    --line: #ddd6c8;
    --accent: #7b4b2a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Noto Sans KR", sans-serif;
    color: var(--text);
    background: var(--bg);
  }
  .shell {
    min-height: 100vh;
    display: grid;
    grid-template-rows: auto 1fr;
  }
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 18px 20px;
    background: var(--paper);
    border-bottom: 1px solid var(--line);
  }
  .title {
    min-width: 0;
  }
  .title h1 {
    margin: 0;
    font-size: 22px;
  }
  .title p {
    margin: 4px 0 0;
    font-size: 13px;
    color: var(--muted);
  }
  .actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 42px;
    padding: 0 16px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--text);
    text-decoration: none;
    font-size: 14px;
    font-weight: 700;
  }
  .btn.primary {
    background: var(--primary);
    border-color: var(--primary);
    color: #fff;
  }
  .viewer-wrap {
    padding: 18px;
  }
  .viewer {
    min-height: calc(100vh - 103px);
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #efe8dc;
    padding: 18px;
  }
  .viewer-status {
    padding: 24px 18px;
    color: var(--muted);
    font-size: 14px;
    text-align: center;
  }
  .page-stack {
    display: grid;
    gap: 18px;
  }
  .page-card {
    background: var(--paper);
    border-radius: 6px;
    box-shadow: 0 6px 20px rgba(31, 31, 31, 0.08);
    overflow: hidden;
  }
  .page-image {
    display: block;
    width: 100%;
    height: auto;
  }
  .page-label {
    padding: 10px 14px;
    border-top: 1px solid #ece5d9;
    background: #fcfaf6;
    color: var(--muted);
    font-size: 13px;
    font-weight: 700;
  }
  @media (max-width: 720px) {
    .topbar {
      align-items: flex-start;
      flex-direction: column;
    }
    .viewer {
      min-height: calc(100vh - 162px);
      padding: 12px;
    }
  }
</style>
</head>
<body>
  <div class="shell">
    <div class="topbar">
      <div class="title">
        <h1>중고등부 계획서</h1>
        <p>브라우저에서 바로 열람하고 필요하면 내려받을 수 있습니다.</p>
      </div>
      <div class="actions">
        <a class="btn" href="index.html">메인으로</a>
        <a class="btn primary" href="2026-middle-high-plan.pdf" download>다운로드</a>
      </div>
    </div>
    <div class="viewer-wrap">
      <div class="viewer" id="viewer">
        <div class="viewer-status" id="viewer-status" hidden>이미지를 불러오는 중입니다.</div>
        <div class="page-stack">
          <figure class="page-card">
            <img class="page-image" src="plan-page-01.jpeg" alt="중고등부 계획서 1페이지" loading="eager">
            <figcaption class="page-label">1 / 8</figcaption>
          </figure>
          <figure class="page-card">
            <img class="page-image" src="plan-page-02.jpeg" alt="중고등부 계획서 2페이지" loading="lazy">
            <figcaption class="page-label">2 / 8</figcaption>
          </figure>
          <figure class="page-card">
            <img class="page-image" src="plan-page-03.jpeg" alt="중고등부 계획서 3페이지" loading="lazy">
            <figcaption class="page-label">3 / 8</figcaption>
          </figure>
          <figure class="page-card">
            <img class="page-image" src="plan-page-04.jpeg" alt="중고등부 계획서 4페이지" loading="lazy">
            <figcaption class="page-label">4 / 8</figcaption>
          </figure>
          <figure class="page-card">
            <img class="page-image" src="plan-page-05.jpeg" alt="중고등부 계획서 5페이지" loading="lazy">
            <figcaption class="page-label">5 / 8</figcaption>
          </figure>
          <figure class="page-card">
            <img class="page-image" src="plan-page-06.jpeg" alt="중고등부 계획서 6페이지" loading="lazy">
            <figcaption class="page-label">6 / 8</figcaption>
          </figure>
          <figure class="page-card">
            <img class="page-image" src="plan-page-07.jpeg" alt="중고등부 계획서 7페이지" loading="lazy">
            <figcaption class="page-label">7 / 8</figcaption>
          </figure>
          <figure class="page-card">
            <img class="page-image" src="plan-page-08.jpeg" alt="중고등부 계획서 8페이지" loading="lazy">
            <figcaption class="page-label">8 / 8</figcaption>
          </figure>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
