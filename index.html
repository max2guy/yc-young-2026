    function escapeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    function renderList(targetEl, items, emptyText, isTrash) {
      if (!items.length) {
        targetEl.innerHTML = '<div class="recent-empty">' + emptyText + '</div>';
        return;
      }

      targetEl.innerHTML = items.map(function (item) {
        const title = item.title && item.title.trim() ? item.title.trim() : '제목 없음';
        const menuItems = !isTrash
          ? '<button class="menu-item danger" type="button" data-action="trash" data-id="' + item.id + '">휴지통</button>'
          : '<button class="menu-item restore" type="button" data-action="restore" data-id="' + item.id + '">복구</button>' +
            '<button class="menu-item danger" type="button" data-action="purge" data-id="' + item.id + '">완전 삭제</button>';
        return `
          <article class="recent-item" data-open-id="${item.id}">
            <div class="recent-item-main">
              <div class="recent-item-title">${escapeHtml(title)}</div>
              <div class="recent-item-meta">${formatDate(item.updatedAt)}</div>
            </div>
            <div class="recent-item-menu">
              <button class="menu-trigger" type="button" aria-label="문서 메뉴" data-menu-trigger="${item.id}">︙</button>
              <div class="menu-panel" data-menu-panel="${item.id}">
                ${menuItems}
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

      renderList(trashList, items, '휴지통이 비어 있습니다.', true);
    }

    function formatDate(value) {
      if (!value) return '저장 기록 없음';
      const date = new Date(value);
      return date.getFullYear() + '.' +
        String(date.getMonth() + 1).padStart(2, '0') + '.' +
        String(date.getDate()).padStart(2, '0') + ' ' +
        String(date.getHours()).padStart(2, '0') + ':' +
        String(date.getMinutes()).padStart(2, '0');
    }

    function fileStamp() {
      const date = new Date();
      return String(date.getFullYear()) +
        String(date.getMonth() + 1).padStart(2, '0') +
        String(date.getDate()).padStart(2, '0') + '-' +
        String(date.getHours()).padStart(2, '0') +
        String(date.getMinutes()).padStart(2, '0') +
        String(date.getSeconds()).padStart(2, '0');
    }

    function setBackupStatus(text) {
      backupStatus.textContent = text;
    }

    function downloadBlobFile(filename, blob) {
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(function () {
        URL.revokeObjectURL(url);
      }, 1000);
    }

    function createRestoreGuide() {
      return `# yc-young-2026 복구 안내

이 ZIP은 사이트 전체 복구를 위한 백업 패키지입니다.

포함 항목
- 정적 사이트 파일
- 일반 회의자료 데이터
- 휴지통 삭제 감사기록
- 체육대회 실시간 자료
- Firebase 배포 설정 파일

복구 순서
1. ZIP 압축을 해제합니다.
2. 정적 파일을 새 저장소 또는 기존 저장소 루트에 업로드합니다.
3. \`recovery/backup-data.json\`을 열어 데이터 내용을 확인합니다.
4. Firebase Realtime Database에 아래 경로를 복원합니다.

   - deletedMeetingDocumentsAudit
   - ${sportsBackupPath}
5. 필요하면 \`firebase-database.rules.json\`, \`firebase.json\`, \`.firebaserc\`로 Firebase 설정을 다시 배포합니다.

참고
- \`${sportsBackupPath}\` 데이터는 현재 sync-config.js의 path 기준 자료입니다.
- 이 백업은 생성 시점의 전체 복구 재료를 보존하기 위한 용도입니다.
`;
    }

    function fetchStaticFile(path) {
      return fetch(path, { cache: 'no-store' }).then(function (response) {
        if (!response.ok) {
          throw new Error(path + ' 파일을 읽지 못했습니다.');
        }
        return response.blob();
      });
    }

    function isBlankDocument(item) {
      const title = item.title && item.title.trim();
      const text = item.contentText && item.contentText.trim();
      return !title && !text;
    }

    function moveToTrash(id) {
      if (!docsRef) return;
      docsRef.child(id).update({
        deletedAt: firebase.database.ServerValue.TIMESTAMP
      });
    }

    function restoreFromTrash(id) {
      if (!docsRef) return;
      docsRef.child(id).update({
        deletedAt: null
      });
    }

    function purgeDocument(id) {
      purgeTargetId = id;
      purgeNameInput.value = '';
      purgeError.textContent = '';
      purgeModal.classList.add('open');
      setTimeout(function () {
        purgeNameInput.focus();
      }, 30);
    }

    function closePurgeModal() {
      purgeTargetId = null;
      purgeModal.classList.remove('open');
    }

    function confirmPurge() {
      const enteredName = purgeNameInput.value.trim();
      if (!allowedPurgeNames.includes(enteredName)) {
        purgeError.textContent = '허용된 삭제 권한자 이름만 입력할 수 있습니다.';
        return;
      }
      if (!docsRef || !auditRef || !purgeTargetId) return;

      const source = docsCache[purgeTargetId] || {};
      auditRef.child(purgeTargetId).set(Object.assign({}, source, {
        originalId: purgeTargetId,
        finalDeletedBy: enteredName,
        finalDeletedAt: firebase.database.ServerValue.TIMESTAMP
      })).then(function () {
        return docsRef.child(purgeTargetId).remove();
      }).then(function () {
        closePurgeModal();
      }).catch(function () {
        purgeError.textContent = '완전 삭제 처리 중 문제가 생겼습니다.';
      });
    }

    function downloadBackup() {
      if (!window.JSZip) {
        setBackupStatus('ZIP 백업 도구를 불러오지 못했습니다.');
        return;
      }
      if (!docsRef || !auditRef || !sportsRef) {
        setBackupStatus('백업 준비가 아직 끝나지 않았습니다.');
        return;
      }

      backupDownloadBtn.disabled = true;
      setBackupStatus('전체 복구용 ZIP을 준비하는 중입니다...');

      Promise.all([
        docsRef.once('value'),
        auditRef.once('value'),
        sportsRef.once('value'),
        Promise.all(staticBackupFiles.map(function (path) {
          return fetchStaticFile(path).then(function (blob) {
            return { path: path, blob: blob };
          });
        }))
      ]).then(function (results) {
        const payload = {
          exportedAt: new Date().toISOString(),
          source: 'yc-young-2026',
          meetingDocuments: results[0].val() || {},
          deletedMeetingDocumentsAudit: results[1].val() || {},
          sportsMeetingPath: sportsBackupPath,
          sportsMeeting: results[2].val() || {}
        };
        const zip = new JSZip();
        const root = zip.folder('yc-young-2026-backup');
        const recovery = root.folder('recovery');

        results[3].forEach(function (file) {
          root.file(file.path, file.blob);
        });

        Object.keys(inlineBackupFiles).forEach(function (path) {
          root.file(path, inlineBackupFiles[path]);
        });

        recovery.file('backup-data.json', JSON.stringify(payload, null, 2));
        recovery.file('manifest.json', JSON.stringify({
          exportedAt: payload.exportedAt,
          staticFiles: staticBackupFiles,
          inlineFiles: Object.keys(inlineBackupFiles),
          firebaseDataPaths: ['meetingDocuments', 'deletedMeetingDocumentsAudit', sportsBackupPath]
        }, null, 2));
        recovery.file('RESTORE.md', createRestoreGuide());

        return zip.generateAsync({ type: 'blob' });
      }).then(function (blob) {
        downloadBlobFile('yc-young-2026-full-backup-' + fileStamp() + '.zip', blob);
        setBackupStatus('전체 복구용 ZIP을 다운로드했습니다.');
      }).catch(function () {
        setBackupStatus('전체 백업 ZIP을 만들지 못했습니다.');
      }).finally(function () {
        backupDownloadBtn.disabled = false;
      });
    }

    function attachListActions() {
      document.addEventListener('click', function (event) {
        const trigger = event.target.closest('[data-menu-trigger]');
        if (trigger) {
          const id = trigger.dataset.menuTrigger;
          const panel = document.querySelector('[data-menu-panel="' + id + '"]');
          const isOpen = panel && panel.classList.contains('open');
          document.querySelectorAll('.menu-panel.open').forEach(function (el) {
            el.classList.remove('open');
          });
          if (panel && !isOpen) {
            panel.classList.add('open');
          }
          return;
        }

        const button = event.target.closest('[data-action]');
        if (!button) return;

        const action = button.dataset.action;
        const id = button.dataset.id;
        if (!id) return;

        document.querySelectorAll('.menu-panel.open').forEach(function (el) {
          el.classList.remove('open');
        });

        if (action === 'trash') moveToTrash(id);
        if (action === 'restore') restoreFromTrash(id);
        if (action === 'purge') purgeDocument(id);
      });

      document.addEventListener('click', function (event) {
        const item = event.target.closest('[data-open-id]');
        if (!item) return;
        if (event.target.closest('.recent-item-menu')) return;
        window.location.href = 'meeting-editor.html?id=' + item.dataset.openId;
      });

      document.addEventListener('click', function (event) {
        if (event.target.closest('.recent-item-menu')) return;
        document.querySelectorAll('.menu-panel.open').forEach(function (el) {
          el.classList.remove('open');
        });
      });

      purgeCancelBtn.addEventListener('click', closePurgeModal);
      purgeConfirmBtn.addEventListener('click', confirmPurge);
      purgeModal.addEventListener('click', function (event) {
        if (event.target === purgeModal) closePurgeModal();
      });
      purgeNameInput.addEventListener('keydown', function (event) {
        if (event.key === 'Enter') confirmPurge();
      });
      trashToggle.addEventListener('click', function () {
        const willOpen = !trashWrap.classList.contains('open');
        trashWrap.classList.toggle('open', willOpen);
        trashToggle.textContent = willOpen ? '휴지통 닫기' : '휴지통 보기';
      });
      backupToggle.addEventListener('click', function () {
        const willOpen = !backupWrap.classList.contains('open');
        backupWrap.classList.toggle('open', willOpen);
        backupToggle.textContent = willOpen ? '백업 닫기' : '백업 보기';
      });
      backupDownloadBtn.addEventListener('click', downloadBackup);
    }

    function bootRecentDocs() {
      if (!window.SPORTS_SYNC_CONFIG || !window.SPORTS_SYNC_CONFIG.firebase) {
        renderRecent([]);
        renderTrash([]);
        backupDownloadBtn.disabled = true;
        setBackupStatus('Firebase 연결이 없어 백업을 만들 수 없습니다.');
        return;
      }

      if (!firebase.apps.length) {
        firebase.initializeApp(window.SPORTS_SYNC_CONFIG.firebase);
      }

      docsRef = firebase.database().ref('meetingDocuments');
      auditRef = firebase.database().ref('deletedMeetingDocumentsAudit');
      sportsBackupPath = (window.SPORTS_SYNC_CONFIG && window.SPORTS_SYNC_CONFIG.path) || 'sportsMeeting2026';
      sportsRef = firebase.database().ref(sportsBackupPath);

      docsRef.on('value', function (snap) {
        const value = snap.val() || {};
        docsCache = value;
        const items = Object.keys(value).map(function (id) {
          return Object.assign({ id: id }, value[id]);
        });
        items.filter(isBlankDocument).forEach(function (item) {
          docsRef.child(item.id).remove();
        });
        const visibleItems = items.filter(function (item) {
          return !isBlankDocument(item) && !item.deletedAt;
        }).sort(function (a, b) {
          return (b.updatedAt || 0) - (a.updatedAt || 0);
        }).slice(0, 8);
        const trashedItems = items.filter(function (item) {
          return !isBlankDocument(item) && !!item.deletedAt;
        }).sort(function (a, b) {
          return (b.deletedAt || 0) - (a.deletedAt || 0);
        }).slice(0, 8);

        renderRecent(visibleItems);
        renderTrash(trashedItems);
      }, function () {
        recentList.innerHTML = '<div class="recent-empty">최근 회의자료를 불러오지 못했습니다.</div>';
        trashList.innerHTML = '<div class="recent-empty">휴지통을 불러오지 못했습니다.</div>';
      });
    }

    attachListActions();
    bootRecentDocs();
  </script>
</body>
</html>
