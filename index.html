<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#154734">
<title>2026 중고등부 교사 회의 자료</title>
<style>
  :root {
    --bg: #f5f7f4;
    --text: #17241d;
    --muted: #66756c;
    --line: #dce7df;
    --green: #1a6b3c;
    --blue: #1a3a5c;
    --amber: #f4a322;
    --card: #fff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Noto Sans KR", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.55;
  }
  header {
    background: linear-gradient(135deg, #154734, #1a3a5c);
    color: white;
    padding: 34px 20px 30px;
  }
  .wrap { width: min(960px, calc(100% - 32px)); margin: 0 auto; }
  h1 { margin: 0 0 8px; font-size: clamp(26px, 5vw, 42px); letter-spacing: 0; }
  .lead { margin: 0; color: rgba(255,255,255,.82); font-size: 15px; }
  main { padding: 24px 0 42px; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  .card {
    display: block;
    min-height: 210px;
    padding: 22px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--card);
    color: inherit;
    text-decoration: none;
    box-shadow: 0 1px 8px rgba(20, 50, 34, .06);
  }
  .card:focus-visible { outline: 3px solid rgba(244, 163, 34, .45); outline-offset: 3px; }
  .tag { display: inline-block; margin-bottom: 18px; color: white; border-radius: 999px; padding: 5px 11px; font-size: 12px; font-weight: 800; }
  .sports .tag { background: var(--green); }
  .camp .tag { background: var(--blue); }
  .plan .tag { background: #7b4b2a; }
  .meeting .tag { background: #4e5d91; }
  h2 { margin: 0 0 8px; font-size: 23px; letter-spacing: 0; }
  p { margin: 0; color: var(--muted); font-size: 14px; }
  .meta { margin-top: 22px; color: #31453a; font-size: 13px; font-weight: 700; }
  .section {
    margin-top: 22px;
  }
  .section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
  }
  .section-title {
    margin: 0;
    font-size: 18px;
    font-weight: 800;
  }
  .section-action {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 40px;
    padding: 0 14px;
    border-radius: 8px;
    background: #1f514d;
    color: #fff;
    text-decoration: none;
    font-size: 14px;
    font-weight: 700;
  }
  .recent-list {
    display: grid;
    gap: 10px;
  }
  .recent-item {
    display: block;
    padding: 16px 18px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
    color: inherit;
    text-decoration: none;
  }
  .recent-item-title {
    font-size: 16px;
    font-weight: 800;
    color: var(--text);
  }
  .recent-item-meta {
    margin-top: 6px;
    font-size: 13px;
    color: var(--muted);
  }
  .recent-empty {
    padding: 20px 18px;
    border: 1px dashed var(--line);
    border-radius: 8px;
    color: var(--muted);
    background: rgba(255,255,255,0.75);
  }
  @media (max-width: 720px) {
    .grid { grid-template-columns: 1fr; }
    header { padding-top: 28px; }
    .card { min-height: auto; }
    .section-head {
      align-items: flex-start;
      flex-direction: column;
    }
  }
</style>
</head>
<body>
  <header>
    <div class="wrap">
      <h1>2026 중고등부 교사 회의 자료</h1>
      <p class="lead">회의자료 한 곳에서 열람합니다.</p>
    </div>
  </header>
  <main>
    <div class="wrap">
      <div class="grid">
        <a class="card meeting" href="meeting-editor.html">
          <span class="tag">일반 회의</span>
          <h2>새 회의자료 작성</h2>
          <div class="meta">열기 →</div>
        </a>
        <a class="card plan" href="plan-viewer.html">
          <span class="tag">PDF</span>
          <h2>중고등부 계획서</h2>
          <div class="meta">열기 →</div>
        </a>
        <a class="card sports" href="sports-meeting.html">
          <span class="tag">실시간 동기화</span>
          <h2>체육대회 회의자료</h2>
          <div class="meta">열기 →</div>
        </a>
        <a class="card camp" href="camp-comparison.html">
          <span class="tag">읽기 자료</span>
          <h2>2026 수련회 비교 분석</h2>
          <div class="meta">열기 →</div>
        </a>
      </div>
      <section class="section">
        <div class="section-head">
          <h2 class="section-title">최근 회의자료</h2>
          <a class="section-action" href="meeting-editor.html">새 문서</a>
        </div>
        <div class="recent-list" id="recent-list">
          <div class="recent-empty">최근 회의자료를 불러오는 중입니다.</div>
        </div>
      </section>
    </div>
  </main>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  <script src="sync-config.js"></script>
  <script>
    const recentList = document.getElementById('recent-list');

    function renderRecent(items) {
      if (!items.length) {
        recentList.innerHTML = '<div class="recent-empty">아직 작성된 일반 회의자료가 없습니다.</div>';
        return;
      }

      recentList.innerHTML = items.map(function (item) {
        const title = item.title && item.title.trim() ? item.title.trim() : '제목 없음';
        return `
          <a class="recent-item" href="meeting-editor.html?id=${item.id}">
            <div class="recent-item-title">${title}</div>
            <div class="recent-item-meta">${formatDate(item.updatedAt)} · 다시 열기</div>
          </a>
        `;
      }).join('');
    }

    function formatDate(value) {
      if (!value) return '저장 기록 없음';
      const date = new Date(value);
      return date.getFullYear() + '.' +
        String(date.getMonth() + 1).padStart(2, '0') + '.' +
        String(date.getDate()).padStart(2, '0') + ' ' +
        String(date.getHours()).padStart(2, '0') + ':' +
        String(date.getMinutes()).padStart(2, '0');
    }

    function bootRecentDocs() {
      if (!window.SPORTS_SYNC_CONFIG || !window.SPORTS_SYNC_CONFIG.firebase) {
        renderRecent([]);
        return;
      }

      if (!firebase.apps.length) {
        firebase.initializeApp(window.SPORTS_SYNC_CONFIG.firebase);
      }

      firebase.database().ref('meetingDocuments').on('value', function (snap) {
        const value = snap.val() || {};
        const items = Object.keys(value).map(function (id) {
          return Object.assign({ id: id }, value[id]);
        }).sort(function (a, b) {
          return (b.updatedAt || 0) - (a.updatedAt || 0);
        }).slice(0, 8);

        renderRecent(items);
      }, function () {
        recentList.innerHTML = '<div class="recent-empty">최근 회의자료를 불러오지 못했습니다.</div>';
      });
    }

    bootRecentDocs();
  </script>
</body>
</html>
